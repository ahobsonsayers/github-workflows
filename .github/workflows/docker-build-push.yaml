# Build & Push a Docker Image.
# The calling workflow MUST:
# - pass `secrets: inherit`
# - have `DOCKER_REGISTRY_USERNAME` and `DOCKER_REGISTRY_PASSWORD` secrets set UNLESS using ghcr.io registry (these can be auto inferred for ghcr.io)

name: Build & Push Docker Image

on:
  workflow_call:
    inputs:
      working-directory:
        description: Build working directory
        type: string
        default: .
      dockerfile:
        description: Dockerfile path
        type: string
        default: Dockerfile
      image-registry:
        description: Docker image registry (defaults to Docker Hub)
        type: string
        default: docker.io
      image-name:
        description: Docker image name
        type: string
        required: true
      image-tags:
        description: Docker image tags (newline separated)
        type: string
        required: true
      build-args:
        description: Docker build arguments (newline separated KEY=VALUE)
        type: string
        default: ''
      build-cache:
        description: Enable docker build cache
        type: boolean
        default: true
      skip-arm-build:
        description: Skip building/pushing the linux/arm64 image
        type: boolean
        default: false

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - id: set-matrix
        run: |
          MATRIX=$(jq -cn '
            [
              {
                "runner": "ubuntu-24.04",
                "platform": "linux/amd64",
                "platform-slug": "linux-amd64"
              }
            ]
          ')

          if [ "$SKIP_ARM_BUILD" != "true" ]; then
            MATRIX=$(echo "$MATRIX" | jq -c '. + [
              {
                "runner": "ubuntu-24.04-arm",
                "platform": "linux/arm64",
                "platform-slug": "linux-arm64"
              }
            ]')
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
        env:
          SKIP_ARM_BUILD: ${{ inputs.skip-arm-build }}

  build:
    name: Build image
    runs-on: ${{ matrix.runner }}
    needs: prepare
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    outputs:
      image-slug: ${{ steps.get-image-slug.outputs.slug }}

    env:
      REGISTRY_USERNAME: ${{ inputs.image-registry == 'ghcr.io' && github.actor || secrets.DOCKER_REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ inputs.image-registry == 'ghcr.io' && secrets.GITHUB_TOKEN || secrets.DOCKER_REGISTRY_PASSWORD }}

    steps:
      - name: Checkout code
        id: checkout-code
        uses: actions/checkout@v6

      - name: Get image slug
        id: get-image-slug
        run: |
          SLUG="build-$(echo "$IMAGE_NAME" | tr '/:.' '---')"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ${{ inputs.image-name }}

      - name: Check registry secrets are set
        id: check-secrets
        if: inputs.image-registry != 'ghcr.io'
        run: |
          if [ -z "$REGISTRY_USERNAME" ] || [ -z "$REGISTRY_PASSWORD" ]; then
            echo "::error::DOCKER_REGISTRY_USERNAME and DOCKER_REGISTRY_PASSWORD secrets must be set (pass 'secrets: inherit')"
            exit 1
          fi

      - name: Set up Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        id: login-registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.image-registry }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Build and push digest
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.working-directory }}
          file: ${{ inputs.working-directory }}/${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          tags: ${{ inputs.image-registry }}/${{ inputs.image-name }}
          build-args: ${{ inputs.build-args }}
          cache-from: ${{ inputs.build-cache == true && 'type=gha' || '' }}
          cache-to: ${{ inputs.build-cache == true && 'type=gha,mode=max' || '' }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Output digest
        id: output-digest
        uses: GoCodeAlone/github-action-matrix-outputs-write@1.0.3
        with:
          matrix-step-name: ${{ steps.get-image-slug.outputs.slug }}
          matrix-key: ${{ matrix.platform-slug }}
          outputs: |
            digest: ${{ steps.build-and-push.outputs.digest }}

  push-tags:
    name: Push tags
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    env:
      REGISTRY_USERNAME: ${{ inputs.image-registry == 'ghcr.io' && github.actor || secrets.DOCKER_REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ inputs.image-registry == 'ghcr.io' && secrets.GITHUB_TOKEN || secrets.DOCKER_REGISTRY_PASSWORD }}

    steps:
      - name: Set up Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v3

      - name: Get digests
        id: get-digests
        uses: GoCodeAlone/github-action-matrix-outputs-read@1.0.6
        with:
          matrix-step-name: ${{ needs.build.outputs.image-slug }}

      - name: Check registry secrets are set
        id: check-secrets
        if: inputs.image-registry != 'ghcr.io'
        run: |
          if [ -z "$REGISTRY_USERNAME" ] || [ -z "$REGISTRY_PASSWORD" ]; then
            echo "::error::DOCKER_REGISTRY_USERNAME and DOCKER_REGISTRY_PASSWORD secrets must be set (pass 'secrets: inherit')"
            exit 1
          fi

      - name: Login to registry
        id: login-registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.image-registry }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Push tags
        id: push-tags
        run: |
          TAGS_FLAGS=""
          while read -r TAG; do
            [ -z "$TAG" ] && continue
            TAGS_FLAGS="$TAGS_FLAGS -t $IMAGE_NAME:$TAG"
          done <<<"$TAGS_INPUT"

          DIGESTS=$(
            echo "$DIGESTS_JSON" |
            jq -r --arg IMAGE_NAME "$IMAGE_NAME" \
              '.digest | to_entries[] | "\($IMAGE_NAME)@\(.value)"'
          )

          docker buildx imagetools create \
            $TAGS_FLAGS \
            $DIGESTS

          echo "
          Tags: $TAGS_INPUT
          Digests: $DIGESTS
          "
        env:
          IMAGE_NAME: ${{ inputs.image-registry }}/${{ inputs.image-name }}
          DIGESTS_JSON: ${{ steps.get-digests.outputs.result }}
          TAGS_INPUT: ${{ inputs.image-tags }}
